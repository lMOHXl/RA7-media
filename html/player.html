<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    body.white { background: #fff; }
    body.clear { background: transparent; }
    img, video, iframe, #yt { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: fill; }
    img.cover, video.cover { object-fit: cover; }
    img.contain, video.contain { object-fit: contain; }
    #msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
           color: #fff; font: 700 5vmin/1.3 sans-serif; padding: 4vmin; background: #000; z-index: 5; }
</style>
</head>
<body>
<div id="msg"></div>
<script>
    const q = new URLSearchParams(location.search);
    const mode = q.get('mode') || 'black';
    const url = q.get('url') || '';
    const loop = q.get('loop') === '1';
    const muted = q.get('muted') === '1';
    const fit = q.get('fit') || 'fill';

    let el = null;        // <video> / <img> / <iframe>
    let yt = null;        // YT.Player
    let vol = 0.5;
    const msg = document.getElementById('msg');
    const fail = (t) => { msg.textContent = t; msg.style.display = 'flex'; };

    document.body.className = mode === 'white' ? 'white' : mode === 'clear' ? 'clear' : '';

    /* ---------------------------------------------------------------- helpers */
    function ytId(u) {
        const m = u.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([\w-]{11})/);
        return m && m[1];
    }
    function vimeoId(u) {
        const m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
        return m && m[1];
    }
    function loadScript(src, cb, err) {
        const s = document.createElement('script');
        s.src = src; s.onload = cb; s.onerror = err || (() => fail('Script load failed'));
        document.head.appendChild(s);
    }

    /* ---------------------------------------------------------------- YouTube (IFrame Player API) */
    function startYouTube(id, nocookie) {
        document.body.insertAdjacentHTML('afterbegin', '<div id="yt"></div>');
        const make = () => {
            yt = new YT.Player('yt', {
                width: '100%', height: '100%', videoId: id,
                host: nocookie ? 'https://www.youtube-nocookie.com' : 'https://www.youtube.com',
                playerVars: {
                    autoplay: 1, controls: 0, disablekb: 1, fs: 0, rel: 0, modestbranding: 1, iv_load_policy: 3,
                    playsinline: 1, mute: muted ? 1 : 0, loop: loop ? 1 : 0, playlist: loop ? id : undefined,
                    origin: location.origin,
                },
                events: {
                    onReady: (e) => {
                        try { e.target.setVolume(Math.round(vol * 100)); if (muted) e.target.mute(); e.target.playVideo(); } catch (_) {}
                        setTimeout(() => applyCtl(last), 300);
                    },
                    onStateChange: (e) => {
                        if (e.data === 0 && loop) { try { e.target.seekTo(0, true); e.target.playVideo(); } catch (_) {} }
                    },
                    onError: (e) => {
                        if (!nocookie) {            // retry once through the no-cookie host
                            try { yt.destroy(); } catch (_) {}
                            yt = null;
                            return startYouTube(id, true);
                        }
                        const why = { 2: 'bad link', 5: 'player error', 100: 'video removed', 101: 'embedding disabled by owner', 150: 'embedding disabled by owner', 153: 'embed blocked (no referrer)' }[e.data] || 'error';
                        fail('YouTube: ' + why + ' (' + e.data + ')');
                    },
                },
            });
        };
        if (window.YT && YT.Player) make();
        else {
            window.onYouTubeIframeAPIReady = make;
            loadScript('https://www.youtube.com/iframe_api', null, () => fail('YouTube API blocked'));
        }
    }

    /* ---------------------------------------------------------------- other sources */
    function startVimeo(id) {
        el = document.createElement('iframe');
        el.allow = 'autoplay; fullscreen';
        el.src = 'https://player.vimeo.com/video/' + id + '?autoplay=1&background=1&muted=' + (muted ? 1 : 0) + '&loop=' + (loop ? 1 : 0);
        document.body.appendChild(el);
    }

    function startVideoTag(src) {
        el = document.createElement('video');
        el.className = fit;
        el.autoplay = true; el.loop = loop; el.muted = muted; el.playsInline = true;
        el.volume = vol;
        el.onerror = () => fail('Video failed to load (' + ((el.error && el.error.code) || '?') + ')');
        document.body.appendChild(el);
        const go = () => el.play().catch(() => { el.muted = true; el.play().catch(() => {}); });
        el.addEventListener('loadedmetadata', () => applyCtl(last));
        if (/\.m3u8(\?|$)/i.test(src) && !el.canPlayType('application/vnd.apple.mpegurl')) {
            loadScript('https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js', () => {
                if (!window.Hls || !Hls.isSupported()) return fail('HLS not supported');
                const h = new Hls();
                h.loadSource(src); h.attachMedia(el);
                h.on(Hls.Events.MANIFEST_PARSED, go);
            });
        } else {
            el.src = src;
            el.addEventListener('canplay', go, { once: true });
            go();
        }
    }

    /* ---------------------------------------------------------------- start */
    if (mode === 'image') {
        el = document.createElement('img');
        el.className = fit;
        el.onerror = () => fail('Image failed to load');
        el.src = url;
        document.body.appendChild(el);
    } else if (mode === 'video') {
        const y = ytId(url), v = vimeoId(url);
        if (y) startYouTube(y, false);
        else if (v) startVimeo(v);
        else if (/\.(mp4|webm|ogg|ogv|mov|m4v|m3u8)(\?|#|$)/i.test(url) || /^https:\/\/cfx-nui-/.test(url)) startVideoTag(url);
        else {                                       // unknown site: try it as an embeddable page
            el = document.createElement('iframe');
            el.allow = 'autoplay; fullscreen; encrypted-media';
            el.src = url;
            document.body.appendChild(el);
        }
    }

    /* ---------------------------------------------------------------- shared play state (play / pause / speed / seek) */
    let last = null;          // last state from the game { playing, speed, pos }
    const YT_RATES = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];

    function applyCtl(d) {
        if (!d) return;
        last = d;
        const speed = Math.max(0.25, Math.min(4, Number(d.speed) || 1));
        if (yt && yt.getPlayerState) {
            try {
                if (yt.getPlayerState() === -1 && !yt.getDuration) return;
                const rate = YT_RATES.reduce((a, b) => (Math.abs(b - speed) < Math.abs(a - speed) ? b : a));
                if (yt.getPlaybackRate() !== rate) yt.setPlaybackRate(rate);
                const dur = yt.getDuration();
                let target = d.pos;
                if (dur > 0) target = loop ? target % dur : Math.min(target, dur - 0.5);
                if (Math.abs(yt.getCurrentTime() - target) > 2.5) yt.seekTo(target, true);
                const st = yt.getPlayerState();
                if (d.playing && st !== 1 && st !== 3) yt.playVideo();
                if (!d.playing && st === 1) yt.pauseVideo();
            } catch (_) {}
        } else if (el && el.tagName === 'VIDEO') {
            try {
                if (el.playbackRate !== speed) el.playbackRate = speed;
                const dur = el.duration;
                let target = d.pos;
                if (isFinite(dur) && dur > 0) target = loop ? target % dur : Math.min(target, dur - 0.3);
                if (Math.abs(el.currentTime - target) > 2.5) el.currentTime = target;
                if (d.playing && el.paused) el.play().catch(() => {});
                if (!d.playing && !el.paused) el.pause();
            } catch (_) {}
        } else if (el && el.tagName === 'IFRAME' && /vimeo/.test(el.src)) {
            const post = (m, v) => el.contentWindow.postMessage(JSON.stringify(v === undefined ? { method: m } : { method: m, value: v }), '*');
            post('setPlaybackRate', speed);
            post(d.playing ? 'play' : 'pause');
        }
    }

    /* ---------------------------------------------------------------- volume from the game (distance based) */
    window.addEventListener('message', (e) => {
        const d = e.data;
        if (d && d.type === 'ctl') return applyCtl(d);
        if (!d || d.type !== 'vol') return;
        vol = Math.max(0, Math.min(1, Number(d.v) || 0));
        if (muted) return;
        if (yt && yt.setVolume) { try { yt.setVolume(Math.round(vol * 100)); } catch (_) {} }
        else if (el && el.tagName === 'VIDEO') el.volume = vol;
        else if (el && el.tagName === 'IFRAME' && /vimeo/.test(el.src)) {
            el.contentWindow.postMessage(JSON.stringify({ method: 'setVolume', value: vol }), '*');
        }
    });
</script>
</body>
</html>
